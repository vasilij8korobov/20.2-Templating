{% extends 'product/base.html' %}
{% block content %}
<div class="container">
    <form class="row" method="post" enctype="multipart/form-data">
        <div class="col-6">
            <div class="card">
                {% csrf_token %}
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-primary">
                Войти
            </button>
        </div>
    </form>
    <a href="{% url 'users:password_reset' %}">Восстановить пароль</a>
</div>
{% endblock %}
